<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}!! placeholder title{% endblock %}</title>

  <!-- bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/brite/bootstrap.min.css">
  {# <link rel="stylesheet" href="{{ url_for('static', path='/bootstrap/bootstrap.css') }}"> #}

  <!-- bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  {# <script src="{{ url_for('static', path='/bootstrap/bootstrap.min.js') }}"></script> #}

  {# alpine JS #}
  {# <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script> #}

  <script src="{{ url_for('static', path='/js/crypt.js') }}"></script>
  <script src="{{ url_for('static', path='/js/common.js') }}"></script>

  <!-- the icon -->
  <link rel="icon" href="{{ url_for('static', path='/favicon.ico') }}">
</head>

<body>
  <!-- our navbar! -->
  <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <img src="/static/logo.svg" alt="logo" width="24" height="30" class="me-2">
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/">home</a>
          </li>
          {% if request.session.get("user") %}
          <li class="nav-item">
            <form method="post" action="/logout" class="d-inline">

              <input type="hidden" name="csrf" value="{{ csrf }}">

              <button type="submit" class="nav-link">
                logout
              </button>

            </form>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link" href="/login">login</a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- where we optionally flash an alert -->
  <div id="alert-container" class="p-3"></div>

  <!-- custom user info -->
  <div class="container-fluid">
    {% block content %}
    {% endblock %}
  </div>

  {% block scripts %}
  {% endblock %}
</body>

</html>
