{% extends "base.html" %}
{# TODO: make the title better #}
{% block title %}Peeking {{ roomID }}{% endblock %}

{% block content %}
<div class="d-flex vh-75 p-3 gap-3">

    <!-- Left: Game canvas -->
    <div class="w-75 d-flex flex-column align-items-center">
        <div class="card w-100" style="height:60vh;">
            <div class="card-body" id="game-view">
                <canvas id="game-canvas" class="w-100 h-100"></canvas>
            </div>
        </div>

        <div class="mt-3 d-flex gap-2 justify-content-center w-100">
            <button class="btn btn-primary">Open game</button>
            <button class="btn btn-info">Start game</button>
        </div>
    </div>

    <!-- Right: Accordion -->
    <div class="w-25 flex-column">
        <div class="accordion" id="playernames">
            <div class="accordion-item" id="title">
                <h3 class="accordion-header">
                    Test
                </h3>
            </div>
            {# JS inserts players here#}
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    window.CSRF_TOKEN = "{{ csrf }}";
    window.roomID = {{ roomID }}
</script>
<script src="{{ url_for('static', path='/js/peek.js') }}"></script>
{% endblock %}
